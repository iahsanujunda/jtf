name: jtf
version: "0.1.0"
config-version: 2
profile: jtf

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
seed-paths: [seeds]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Decision time T is 09:00 JST on D−1, one hour before JEPX's 10:00 gate closure.
  decision_hour_jst: 9
  # The first target day of training and backtests: MSM radiation is missing before it
  # (notebook 02, section 8).
  first_target_day: "2024-02-17"
  # The sun is computed, not read, so its table covers a fixed range: from TEPCO's first yearly
  # actuals to well past today. A data test fails once decision slots run past its end.
  sun_first_day: "2016-04-01"
  sun_last_day: "2030-12-31"

# Seeds are reference data, so they sit with the dimensions.
seeds:
  jtf:
    +schema: dim

models:
  jtf:
    # ODS is not built by dbt: the jtf parsers load it, and dbt reads it as sources.
    dim:
      +schema: dim
      +materialized: table
    dwd:
      +schema: dwd
      +materialized: table
    dws:
      +schema: dws
      +materialized: table
