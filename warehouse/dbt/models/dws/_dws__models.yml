  - name: the_spine_runs_to_the_day_after_the_newest_capture_in_jst
    description: >
      The newest capture is the 08:45 JST capture of 17 November (23:45 UTC on the 16th): target
      day 18 November exists, with T at 09:00 JST on the 17th, and nothing after it. Its date is
      taken in JST: in UTC it would be the 16th and the 18th would be missing. With the first target
      day set to the 18th, that is one day of 48 slots.
    model: dws_decision_slots
    overrides:
      vars: {first_target_day: "2026-11-18"}
    given:
      - input: ref('dwd_source_captures')
        rows:
          - {source: tepco_actuals, known_at: "2026-11-15 23:45:00+00"}
          - {source: openmeteo_live, known_at: "2026-11-16 23:45:00+00"}
    expect:
      format: sql
      rows: |
        select
            timestamp '2026-11-17 00:00:00+00' as decision_time,
            date '2026-11-18' as target_day,
            slot_code,
            timestamp_add(timestamp '2026-11-17 15:00:00+00', interval 30 * (slot_code - 1) minute) as slot_start
        from unnest(generate_array(1, 48)) as slot_code

  # dws_fidelity. T is 09:00 JST on D−1 (00:00 UTC). At T on the 16th every input is approximate,
  # at T on the 17th every one is exact.
  - name: fidelity_is_per_input_from_the_versions_read
    description: >
      At T on the 16th: D−2's slot 00:00 is rule-dated, so actuals_d2 is approximate; a version of
      a D−2 slot known one minute after T and a wind value are not read. The weather comes from
      Previous Runs. One of the two releases read has files changed after its known_at. At T on
      the 17th: D−2's slots are captured, the weather is the live capture, and the rule-dated
      release's files are unchanged since its known_at, so it counts as exact. The seven days back
      read curtailed output too, and at T on the 17th still hold the rule-dated slot of the 15th:
      actuals_7d stays approximate where actuals_d2 is already exact.
    model: dws_fidelity
    given:
      - input: ref('dws_decision_slots')
        rows:
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:00:00+00"}
          - {decision_time: "2026-11-17 00:00:00+00", target_day: "2026-11-18", slot_start: "2026-11-18 03:00:00+00"}
      - input: ref('dwd_tepco_actuals')
        rows:
          - {slot_start: "2026-11-13 03:00:00+00", measure: solar_curtailed, basis: captured, known_at: "2026-11-13 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-14 15:00:00+00", measure: solar, basis: rule, known_at: "2026-11-14 16:30:00+00", known_until: null}
          - {slot_start: "2026-11-15 03:00:00+00", measure: solar, basis: captured, known_at: "2026-11-15 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-15 03:30:00+00", measure: solar, basis: captured, known_at: "2026-11-16 00:01:00+00", known_until: null}
          - {slot_start: "2026-11-15 03:00:00+00", measure: wind, basis: rule, known_at: "2026-11-15 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-16 03:00:00+00", measure: solar, basis: captured, known_at: "2026-11-16 23:45:00+00", known_until: null}
      - input: ref('dws_weather')
        rows:
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", source: previous_runs}
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", source: previous_runs}
          - {decision_time: "2026-11-17 00:00:00+00", target_day: "2026-11-18", source: live}
      - input: ref('dws_capacity')
        rows:
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", oldest_ref_date: "2026-03-31", newest_ref_date: "2026-06-30"}
          - {decision_time: "2026-11-17 00:00:00+00", target_day: "2026-11-18", oldest_ref_date: "2026-03-31", newest_ref_date: "2026-03-31"}
      - input: ref('dwd_capacity_releases')
        rows:
          - {ref_date: "2026-03-31", basis: rule, known_at: "2026-08-18 15:00:00+00", known_until: null, a_last_modified: "2026-08-18 04:42:27+00", b_last_modified: "2026-08-18 04:42:52+00"}
          - {ref_date: "2026-06-30", basis: rule, known_at: "2026-11-01 15:00:00+00", known_until: null, a_last_modified: "2026-11-10 00:00:00+00", b_last_modified: "2026-11-01 00:00:00+00"}
    expect:
      rows:
        - {decision_time: "2026-11-16 00:00:00+00", input: actuals_d2, versions_read: 2, approximate_versions: 1, fidelity: approximate}
        - {decision_time: "2026-11-16 00:00:00+00", input: actuals_7d, versions_read: 3, approximate_versions: 1, fidelity: approximate}
        - {decision_time: "2026-11-16 00:00:00+00", input: weather, versions_read: 2, approximate_versions: 2, fidelity: approximate}
        - {decision_time: "2026-11-16 00:00:00+00", input: capacity, versions_read: 2, approximate_versions: 1, fidelity: approximate}
        - {decision_time: "2026-11-17 00:00:00+00", input: actuals_d2, versions_read: 1, approximate_versions: 0, fidelity: exact}
        - {decision_time: "2026-11-17 00:00:00+00", input: actuals_7d, versions_read: 5, approximate_versions: 1, fidelity: approximate}
        - {decision_time: "2026-11-17 00:00:00+00", input: weather, versions_read: 1, approximate_versions: 0, fidelity: exact}
        - {decision_time: "2026-11-17 00:00:00+00", input: capacity, versions_read: 1, approximate_versions: 0, fidelity: exact}

  # The area's weather. T is 09:00 JST on 2026-11-16; one slot, two points, weights 0.75 and 0.25.
  - name: the_areas_forecast_is_msm_weighted_by_each_points_share_of_capacity
    description: >
      At 12:00 JST: mito (weight 0.75) is forecast 800 W/m² and 20 °C, numazu (0.25) 400 W/m² and
      12 °C: 700 W/m² and 18 °C for the area. ECMWF's 999 is another model's. At 12:30 numazu has
      no radiation: the area has none either, never mito's 600 alone; its temperature stands.
    model: dws_weather_area
    given:
      - input: ref('dws_point_weights')
        rows:
          - {decision_time: "2026-11-16 00:00:00+00", point: mito, weight: 0.75}
          - {decision_time: "2026-11-16 00:00:00+00", point: numazu, weight: 0.25}
      - input: ref('dws_weather')
        rows:
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:00:00+00", point: mito, model: jma_msm, ghi_w_m2: 800, direct_w_m2: 600, diffuse_w_m2: 200, cloud_cover_pct: 10, temperature_c: 20, wind_speed_kmh: 8}
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:00:00+00", point: numazu, model: jma_msm, ghi_w_m2: 400, direct_w_m2: 200, diffuse_w_m2: 200, cloud_cover_pct: 50, temperature_c: 12, wind_speed_kmh: 16}
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:00:00+00", point: mito, model: ecmwf_ifs025, ghi_w_m2: 999, direct_w_m2: 999, diffuse_w_m2: 999, cloud_cover_pct: 99, temperature_c: 99, wind_speed_kmh: 99}
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:30:00+00", point: mito, model: jma_msm, ghi_w_m2: 600, direct_w_m2: 400, diffuse_w_m2: 200, cloud_cover_pct: 10, temperature_c: 20, wind_speed_kmh: 8}
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:30:00+00", point: numazu, model: jma_msm, ghi_w_m2: null, direct_w_m2: 200, diffuse_w_m2: 200, cloud_cover_pct: 50, temperature_c: 12, wind_speed_kmh: 16}
    expect:
      rows:
        - {slot_start: "2026-11-17 03:00:00+00", ghi_w_m2: 700, direct_w_m2: 500, diffuse_w_m2: 200, cloud_cover_pct: 20, temperature_c: 18, wind_speed_kmh: 10, points: 2}
        - {slot_start: "2026-11-17 03:30:00+00", ghi_w_m2: null, direct_w_m2: 350, diffuse_w_m2: 200, cloud_cover_pct: 20, temperature_c: 18, wind_speed_kmh: 10, points: 2}

  - name: the_forecast_week_is_the_same_slot_on_the_target_days_d8_to_d2
    description: >
      Slot 12:00 on the 17th: forecast 630 W/m²; the forecasts for the same slot on the 9th to the
      15th were 700, 600, 500, 400, 300, 200 and 100, a mean of 400. The 8th (7,000) and the 16th
      (9,000) are outside the week. Slot 12:30 has six of the seven days: no mean.
    model: dws_solar_features
    given:
      - input: ref('dws_decision_slots')
        rows:
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:00:00+00"}
          - {decision_time: "2026-11-16 00:00:00+00", target_day: "2026-11-17", slot_start: "2026-11-17 03:30:00+00"}
      - input: ref('dws_weather_area')
        format: sql
        rows: |
          select timestamp(datetime(2026, 11, day, 3, minute, 0)) as slot_start,
            timestamp(datetime(2026, 11, day - 1, 0, 0, 0)) as decision_time,
            cast([7000, 700, 600, 500, 400, 300, 200, 100, 9000, 630][offset(day - 8)] as float64) as ghi_w_m2,
            100.0 as direct_w_m2, 50.0 as diffuse_w_m2, 30.0 as cloud_cover_pct, 15.0 as temperature_c
          from unnest(generate_array(8, 17)) as day cross join unnest([0, 30]) as minute
          where not (day = 12 and minute = 30)
      - input: ref('dwd_tepco_actuals')
        rows: []
      - input: ref('dws_capacity')
        rows: []
      - input: ref('dws_point_weights')
        rows: []
      - input: ref('dim_sun_slots')
        rows: []
    expect:
      rows:
        - {slot_start: "2026-11-17 03:00:00+00", forecast_ghi_w_m2: 630, forecast_direct_w_m2: 100, forecast_cloud_cover_pct: 30, forecast_temperature_c: 15, forecast_ghi_mean_7d_w_m2: 400}
        - {slot_start: "2026-11-17 03:30:00+00", forecast_ghi_w_m2: 630, forecast_direct_w_m2: 100, forecast_cloud_cover_pct: 30, forecast_temperature_c: 15, forecast_ghi_mean_7d_w_m2: null}

