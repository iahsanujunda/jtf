version: 2

models:
  - name: ads_ml_label_solar
    description: >
      The truth of each slot from February 2024: TEPCO's actuals at their latest version, never
      read through as_of. label_mw is delivered plus curtailed, what the weather allowed.
    columns:
      - name: slot_start
        data_tests: [unique, not_null]
      - name: label_mw
        description: Solar the weather allowed in MW, averaged over the slot. The forecast target.
      - name: delivered_mw
        description: Solar delivered to the grid, in MW.
      - name: curtailed_mw
        description: Solar curtailed by output control, in MW.
    data_tests:
      - expression_is_true:
          arguments:
            expression: label_mw >= delivered_mw and curtailed_mw >= 0

  - name: ads_ml_day_solar
    description: >
      A day and the groups results are read by: how clear it was against a clear day at its time
      of year, whether it was curtailed, its season. Known only afterwards, from the labels and
      from later days: for reading results, never an input.
    columns:
      - name: day
        description: The day in JST. A day has a row once all 48 of its slots have a label.
        data_tests: [unique, not_null]
      - name: day_ratio
        description: The day's label over its clear-sky output, across its lit slots.
        data_tests: [not_null]
      - name: clear_ratio
        description: >
          What a clear day gives at that time of year: the 90th percentile of day_ratio over the
          29 days around the day. Null until all 14 later days are whole.
      - name: clearness
        description: day_ratio over clear_ratio. Null until all 14 later days are whole.
      - name: sky
        description: clear from a clearness of 0.9, cloudy under 0.5, mixed between; null until set.
        data_tests:
          - accepted_values:
              arguments:
                values: [clear, mixed, cloudy]
      - name: is_curtailed
        description: Some slot of the day was curtailed.
        data_tests: [not_null]
      - name: season
        description: winter is December to February, then spring, summer and autumn by three months.
        data_tests:
          - accepted_values:
              arguments:
                values: [winter, spring, summer, autumn]

  - name: ads_ml_outcome_solar
    description: >
      Each prediction met by its label: one row per prediction, with its error in MW and as a
      share of the capacity estimated at its decision time, whether its slot is daylight, and the
      groups its target day falls in (ads_ml_day_solar). Backtest metrics aggregate it.
    columns:
      - name: error_mw
        description: Predicted minus label, MW. Positive means the forecast was too high.
      - name: error_share
        description: error_mw over capacity_mw, the capacity estimated at the decision time.
      - name: is_daylight
        description: Not night by dim_daylight. Metrics count daylight slots only.
        data_tests: [not_null]
      - name: in_range
        description: The label fell between p10_mw and p90_mw; null for a prediction with no range.
      - name: pinball_share
        description: >
          The mean pinball loss of the prediction's three forecasts (P10, P50, P90), over the
          capacity estimated at the decision time; null for a prediction with no range.
      - name: sky
        description: The target day's sky (clear, mixed, cloudy); null until that day is grouped.
      - name: is_curtailed_day
        description: Some slot of the target day was curtailed.
      - name: season
        description: The target day's season.
      - name: price_yen_kwh
        description: >
          The Tokyo spot price of the slot, at its latest version: the weight of the
          price-weighted error. Empty for a slot not yet traded.
      - name: level
        description: >
          What the forecast was made from, as its run recorded it: 0, what its model reads; 2,
          the model's fallback, the day's weather being late.
    data_tests:
      - unique_combination:
          arguments:
            columns: [run_id, model, decision_time, slot_start]

  - name: ads_ml_benchmark_solar
    description: >
      Each prediction set beside TEPCO's own forecast for the same slot, wherever TEPCO's was
      captured: one row per prediction and slot. TEPCO forecasts wind and solar together, so the
      run's solar forecast has the same slot's wind two days back added, and both are measured
      against delivered wind plus solar. TEPCO's forecast is made about ten hours later than the
      run's (notebook 12).
    columns:
      - name: forecast_mw
        description: >
          The run's solar forecast plus wind two days back, as known at its decision time; null
          where either is missing.
      - name: tepco_mw
        description: TEPCO's forecast of wind and solar, at its latest version.
        data_tests: [not_null]
      - name: actual_mw
        description: Delivered solar plus wind, at their latest versions; null until both are in.
      - name: error_mw
        description: forecast_mw minus actual_mw. Positive means the forecast was too high.
      - name: error_share
        description: error_mw over capacity_mw, the capacity estimated at the decision time.
      - name: tepco_error_mw
        description: tepco_mw minus actual_mw.
      - name: tepco_error_share
        description: tepco_error_mw over the same capacity, so the two shares compare.
      - name: is_daylight
        description: Not night by dim_daylight. The comparison counts daylight slots only.
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [run_id, model, decision_time, slot_start]

unit_tests:
  # Times are UTC; JST is UTC+9. Slot 12:00 JST on 2026-11-14 is 03:00 UTC.

  - name: a_label_is_delivered_plus_curtailed_at_their_latest_versions
    description: >
      Slot 12:00: delivered was corrected from 5,000 to 5,200 and 300 MW were curtailed, so the
      label is 5,500. Slot 12:30: nothing curtailed. Wind never counts.
    model: ads_ml_label_solar
    given:
      - input: ref('dwd_tepco_actuals')
        rows:
          - {slot_start: "2026-11-14 03:00:00+00", measure: solar, value_mw: 5000, known_at: "2026-11-14 05:00:00+00", known_until: "2026-12-01 00:30:00+00"}
          - {slot_start: "2026-11-14 03:00:00+00", measure: solar, value_mw: 5200, known_at: "2026-12-01 00:30:00+00", known_until: null}
          - {slot_start: "2026-11-14 03:00:00+00", measure: solar_curtailed, value_mw: 300, known_at: "2026-11-14 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-14 03:00:00+00", measure: wind, value_mw: 100, known_at: "2026-11-14 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-14 03:30:00+00", measure: solar, value_mw: 6000, known_at: "2026-11-14 05:30:00+00", known_until: null}
          - {slot_start: "2026-11-14 03:30:00+00", measure: solar_curtailed, value_mw: 0, known_at: "2026-11-14 05:30:00+00", known_until: null}
    expect:
      rows:
        - {slot_start: "2026-11-14 03:00:00+00", label_mw: 5500, delivered_mw: 5200, curtailed_mw: 300}
        - {slot_start: "2026-11-14 03:30:00+00", label_mw: 6000, delivered_mw: 6000, curtailed_mw: 0}

  - name: an_outcome_is_the_prediction_less_its_label_over_capacity_at_t
    description: >
      T is 09:00 JST on 2026-11-13. Slot 12:00 on D: 6,000 predicted against a label of 5,500,
      an error of +500 MW, 0.025 of 20,000 MW. Slot 00:00 on D is night. Slot 12:30 has no actual
      yet: its row stays, with no label and no error. D was a clear, curtailed autumn day, and
      every one of its rows says so. The slot of the next day has no group yet. Only the first
      prediction has a range, 5,000 to 7,000 MW: the label is inside, and its three forecasts cost
      50, 250 and 150 MW, a mean of 150 MW, 0.0075 of capacity. Each outcome carries the level its
      prediction was made at, and none where the run recorded none. The Tokyo price of slot 12:00 was
      corrected from 11 to 12 yen: the outcome carries the latest, never the system price, and the
      slots with no price carry none.
    model: ads_ml_outcome_solar
    given:
      - input: source('ads', 'ads_ml_prediction_solar')
        rows:
          - {run_id: r1, model: persistence_d2, mode: backtest, fold: "2026-11-01", decision_time: "2026-11-13 00:00:00+00", target_day: "2026-11-14", slot_start: "2026-11-14 03:00:00+00", predicted_mw: 6000, p10_mw: 5000, p90_mw: 7000, level: 2}
          - {run_id: r1, model: persistence_d2, mode: backtest, fold: "2026-11-01", decision_time: "2026-11-13 00:00:00+00", target_day: "2026-11-14", slot_start: "2026-11-13 15:00:00+00", predicted_mw: 0, level: 0}
          - {run_id: r1, model: persistence_d2, mode: backtest, fold: "2026-11-01", decision_time: "2026-11-13 00:00:00+00", target_day: "2026-11-14", slot_start: "2026-11-14 03:30:00+00", predicted_mw: 6100}
          - {run_id: r1, model: persistence_d2, mode: backtest, fold: "2026-11-01", decision_time: "2026-11-14 00:00:00+00", target_day: "2026-11-15", slot_start: "2026-11-15 03:00:00+00", predicted_mw: 6200}
      - input: ref('ads_ml_label_solar')
        rows:
          - {slot_start: "2026-11-14 03:00:00+00", label_mw: 5500}
          - {slot_start: "2026-11-13 15:00:00+00", label_mw: 0}
      - input: ref('dws_capacity')
        rows:
          - {decision_time: "2026-11-13 00:00:00+00", capacity_mw: 20000}
      - input: ref('dim_daylight')
        rows:
          - {slot_start: "2026-11-14 03:00:00+00", is_night: false}
          - {slot_start: "2026-11-13 15:00:00+00", is_night: true}
          - {slot_start: "2026-11-14 03:30:00+00", is_night: false}
          - {slot_start: "2026-11-15 03:00:00+00", is_night: false}
      - input: ref('ads_ml_day_solar')
        rows:
          - {day: "2026-11-14", sky: clear, is_curtailed: true, season: autumn}
      - input: ref('dwd_jepx_spot')
        rows:
          - {slot_start: "2026-11-14 03:00:00+00", measure: price_tokyo, value_yen_kwh: 11.0, known_at: "2026-11-13 02:00:00+00", known_until: "2026-11-14 02:00:00+00"}
          - {slot_start: "2026-11-14 03:00:00+00", measure: price_tokyo, value_yen_kwh: 12.0, known_at: "2026-11-14 02:00:00+00", known_until: null}
          - {slot_start: "2026-11-14 03:00:00+00", measure: price_system, value_yen_kwh: 99.0, known_at: "2026-11-13 02:00:00+00", known_until: null}
    expect:
      rows:
        - {slot_start: "2026-11-14 03:00:00+00", label_mw: 5500, error_mw: 500, error_share: 0.025, is_daylight: true, in_range: true, pinball_share: 0.0075, sky: clear, is_curtailed_day: true, season: autumn, price_yen_kwh: 12.0, level: 2}
        - {slot_start: "2026-11-13 15:00:00+00", label_mw: 0, error_mw: 0, error_share: 0, is_daylight: false, in_range: null, pinball_share: null, sky: clear, is_curtailed_day: true, season: autumn, price_yen_kwh: null, level: 0}
        - {slot_start: "2026-11-14 03:30:00+00", label_mw: null, error_mw: null, error_share: null, is_daylight: true, in_range: null, pinball_share: null, sky: clear, is_curtailed_day: true, season: autumn, price_yen_kwh: null, level: null}
        - {slot_start: "2026-11-15 03:00:00+00", label_mw: null, error_mw: null, error_share: null, is_daylight: true, in_range: null, pinball_share: null, sky: null, is_curtailed_day: null, season: null, price_yen_kwh: null, level: null}

  - name: a_comparison_sets_both_forecasts_against_delivered_wind_and_solar
    description: >
      T is 09:00 JST on 2026-11-15, for the 16th. Slot 12:00: the run said 12,000 MW of solar and
      wind two days back was 200, so its forecast is 12,200; TEPCO's, corrected from 11,000 to
      12,800 in a later capture, is 12,800; 12,500 of solar and 300 of wind were delivered, with
      400 curtailed that doesn't count: 12,800. The run is 600 low, 0.03 of 20,000 MW; TEPCO is
      exact. Slot 12:30 has no actuals yet: it keeps its row with no error. Slot 13:00 was never
      forecast by TEPCO, and slot 00:00 is night: the first has no row, the second says so.
    model: ads_ml_benchmark_solar
    given:
      - input: source('ads', 'ads_ml_prediction_solar')
        rows:
          - {run_id: r1, model: lgbm_quantiles, mode: what-if, decision_time: "2026-11-15 00:00:00+00", target_day: "2026-11-16", slot_start: "2026-11-16 03:00:00+00", predicted_mw: 12000}
          - {run_id: r1, model: lgbm_quantiles, mode: what-if, decision_time: "2026-11-15 00:00:00+00", target_day: "2026-11-16", slot_start: "2026-11-16 03:30:00+00", predicted_mw: 11500}
          - {run_id: r1, model: lgbm_quantiles, mode: what-if, decision_time: "2026-11-15 00:00:00+00", target_day: "2026-11-16", slot_start: "2026-11-16 04:00:00+00", predicted_mw: 11000}
          - {run_id: r1, model: lgbm_quantiles, mode: what-if, decision_time: "2026-11-15 00:00:00+00", target_day: "2026-11-16", slot_start: "2026-11-15 15:00:00+00", predicted_mw: 0}
      - input: ref('dwd_tepco_forecast_next_day')
        rows:
          - {slot_start: "2026-11-16 03:00:00+00", measure: wind_solar, value_mw: 11000, known_at: "2026-11-15 10:00:00+00", known_until: "2026-11-15 13:00:00+00"}
          - {slot_start: "2026-11-16 03:00:00+00", measure: wind_solar, value_mw: 12800, known_at: "2026-11-15 13:00:00+00", known_until: null}
          - {slot_start: "2026-11-16 03:00:00+00", measure: demand, value_mw: 32000, known_at: "2026-11-15 10:00:00+00", known_until: null}
          - {slot_start: "2026-11-16 03:30:00+00", measure: wind_solar, value_mw: 12000, known_at: "2026-11-15 10:00:00+00", known_until: null}
          - {slot_start: "2026-11-15 15:00:00+00", measure: wind_solar, value_mw: 150, known_at: "2026-11-15 10:00:00+00", known_until: null}
      - input: ref('dwd_tepco_actuals')
        rows:
          - {slot_start: "2026-11-16 03:00:00+00", measure: solar, value_mw: 12500, known_at: "2026-11-16 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-16 03:00:00+00", measure: wind, value_mw: 250, known_at: "2026-11-16 05:00:00+00", known_until: "2026-11-17 00:00:00+00"}
          - {slot_start: "2026-11-16 03:00:00+00", measure: wind, value_mw: 300, known_at: "2026-11-17 00:00:00+00", known_until: null}
          - {slot_start: "2026-11-16 03:00:00+00", measure: solar_curtailed, value_mw: 400, known_at: "2026-11-16 05:00:00+00", known_until: null}
          - {slot_start: "2026-11-15 15:00:00+00", measure: solar, value_mw: 0, known_at: "2026-11-15 17:00:00+00", known_until: null}
          - {slot_start: "2026-11-15 15:00:00+00", measure: wind, value_mw: 180, known_at: "2026-11-15 17:00:00+00", known_until: null}
      - input: ref('dws_solar_features')
        rows:
          - {decision_time: "2026-11-15 00:00:00+00", slot_start: "2026-11-16 03:00:00+00", wind_d2_mw: 200}
          - {decision_time: "2026-11-15 00:00:00+00", slot_start: "2026-11-16 03:30:00+00", wind_d2_mw: 210}
          - {decision_time: "2026-11-15 00:00:00+00", slot_start: "2026-11-15 15:00:00+00", wind_d2_mw: 160}
          - {decision_time: "2026-11-14 00:00:00+00", slot_start: "2026-11-16 03:00:00+00", wind_d2_mw: 9999}
      - input: ref('dws_capacity')
        rows:
          - {decision_time: "2026-11-15 00:00:00+00", capacity_mw: 20000}
      - input: ref('dim_daylight')
        rows:
          - {slot_start: "2026-11-16 03:00:00+00", is_night: false}
          - {slot_start: "2026-11-16 03:30:00+00", is_night: false}
          - {slot_start: "2026-11-15 15:00:00+00", is_night: true}
    expect:
      rows:
        - {slot_start: "2026-11-16 03:00:00+00", forecast_mw: 12200, tepco_mw: 12800, actual_mw: 12800, error_mw: -600, error_share: -0.03, tepco_error_mw: 0, tepco_error_share: 0, is_daylight: true}
        - {slot_start: "2026-11-16 03:30:00+00", forecast_mw: 11710, tepco_mw: 12000, actual_mw: null, error_mw: null, error_share: null, tepco_error_mw: null, tepco_error_share: null, is_daylight: true}
        - {slot_start: "2026-11-15 15:00:00+00", forecast_mw: 160, tepco_mw: 150, actual_mw: 180, error_mw: -20, error_share: -0.001, tepco_error_mw: -30, tepco_error_share: -0.0015, is_daylight: false}

  # ads_ml_day_solar. 31 whole days of January 2026 and one partial, 48 slots each, capacity
  # 10,000 MW. Slots 20 to 27 are lit (clear sky 1,000 MW); slot 10 has 100 MW of clear sky, too
  # dim to count, and a label of 999 MW that must not either.
  - name: a_days_sky_is_its_ratio_over_a_clear_days_and_is_set_once_14_later_days_are_whole
    description: >
      Most days give 0.8 of clear sky, every fourth day 1.0, so the 90th percentile of any 29 days
      is 1.0 and their median 0.8. The 13th to the 17th give 0.5, 0.9, 0.4, 1.0 and 0.6: mixed,
      clear, cloudy, clear and mixed, with the boundaries at 0.9 and 0.5 on the clear and the mixed
      side. The 16th has one curtailed slot. The 17th is the last with 14 whole days after it; from
      the 18th on a day has its ratio and no group yet. 1 February has only 17 slots: no row.
    model: ads_ml_day_solar
    given:
      - input: ref('dws_solar_features')
        format: sql
        rows: |
          select date_add(date '2026-01-01', interval day - 1 day) as target_day,
            timestamp_add(timestamp '2026-01-01 00:00:00+00', interval (day - 1) * 1440 + slot * 30 minute) as slot_start,
            10000.0 as capacity_mw,
            case when slot between 20 and 27 then 1000.0 when slot = 10 then 100.0 else 0.0 end as clear_sky_mw
          from unnest(generate_array(1, 32)) as day cross join unnest(generate_array(0, 47)) as slot
      - input: ref('ads_ml_label_solar')
        format: sql
        rows: |
          select
            timestamp_add(timestamp '2026-01-01 00:00:00+00', interval (day - 1) * 1440 + slot * 30 minute) as slot_start,
            case
              when slot = 10 then 999.0
              when slot between 20 and 27 then 1000.0 * case day
                when 13 then 0.5 when 14 then 0.9 when 15 then 0.4 when 17 then 0.6
                else if(mod(day, 4) = 0, 1.0, 0.8) end
              else 0.0
            end as label_mw,
            if(day = 16 and slot = 22, 50.0, 0.0) as curtailed_mw
          from unnest(generate_array(1, 32)) as day cross join unnest(generate_array(0, 47)) as slot
          where not (day = 32 and slot > 16)
    expect:
      format: sql
      rows: |
        with days as (
          select day, case day
            when 13 then 0.5 when 14 then 0.9 when 15 then 0.4 when 17 then 0.6
            else if(mod(day, 4) = 0, 1.0, 0.8) end as ratio
          from unnest(generate_array(1, 31)) as day
        )
        select date_add(date '2026-01-01', interval day - 1 day) as day,
          ratio as day_ratio,
          if(day <= 17, 1.0, null) as clear_ratio,
          if(day <= 17, ratio, null) as clearness,
          case when day > 17 then null when ratio >= 0.9 then 'clear' when ratio < 0.5 then 'cloudy'
            else 'mixed' end as sky,
          day = 16 as is_curtailed,
          'winter' as season
        from days

