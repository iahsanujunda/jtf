version: 2

# ODS is loaded by the jtf parsers (jtf/src/jtf/parse), append-only, one table per file layout.
# Named ods/<table> as in Dagster, so lineage runs from each raw file to every model. CI points
# `ods_dataset` at its own empty copy (`jtf ci create`), so it never reads the real ODS.
sources:
  - name: ods
    database: "{{ env_var('JTF_BIGQUERY_PROJECT') }}"
    schema: "{{ var('ods_dataset', 'ods') }}"
    tables:
      - name: raw_files
        description: >
          The manifest: one row per raw file and ODS table, whatever happened to the file.
          A source's capture start is its first `daily` fetch here.
      - name: tepco_actuals
        description: >
          TEPCO's monthly area actuals, one row per slot per capture, in MW averaged over the
          slot, labelled by the slot's start (`date` as 2026/11/1, `time` as 0:00).
      - name: meti_fit_notices
        description: >
          Each announcement of a FIT/FIP capacity release, as one stored copy of METI's summary
          page showed it: the month-end the release describes (`ref_date`) and the date given
          (`announced`). Copies archived by the Wayback Machine carry the archive's time as
          `source_time`; our own captures have none.
      - name: meti_fit_capacity_pref
        description: >
          Table A of each FIT/FIP release, by prefecture: one row per sheet, area and header path,
          the value as found (kW for capacity, a count otherwise). Partitioned by `extraction_date`,
          clustered by `source_file`.
      - name: meti_fit_capacity_city
        description: >
          Table B of each release, by municipality (`area` as 静岡県沼津市), laid out as table A.
          About 2 GB: read only through dwd_capacity_area_files, incrementally.
      - name: openmeteo_previous_runs
        description: >
          Open-Meteo Previous Runs, history only: per point, model, lead (0 to 2 days) and hour
          (UTC), the six variables. Parts of the history were fetched twice (notebook 04,
          section 3.4).
      - name: openmeteo_single_runs
        description: >
          Open-Meteo Single Runs, history only: per point, model, run (its start, UTC) and hour.
      - name: openmeteo_live
        description: >
          The live forecast captured daily at 08:45 JST: per point, model and hour; which run it
          holds is not given.

