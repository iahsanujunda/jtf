        - {source_file: fB, point: numazu, parsed_at: "2026-12-01 00:00:00+00", solar_mw: 0.05}
        - {source_file: fC, point: mito, parsed_at: "2026-12-02 00:00:00+00", solar_mw: 0.12}
        - {source_file: fD, point: mito, parsed_at: "2026-11-16 00:50:00+00", solar_mw: 0.07}

  - name: a_releases_first_figures_are_known_when_the_release_is
    description: >
      End of March 2026's table A was fetched in November 2026, but the release is known by the
      rule on 2026-08-20 (end of day JST): its figures are known then, with the release's basis.
    model: dwd_capacity_area
    given:
      - input: ref('dwd_capacity_area_files')
        rows:
          - {source_file: fA, point: mito, ref_date: "2026-03-31", fetched_at: "2026-11-16 00:42:00+00", solar_mw: 20}
      - input: ref('dwd_capacity_releases')
        rows:
          - {ref_date: "2026-03-31", known_at: "2026-08-20 15:00:00+00", basis: rule}
    expect:
      rows:
        - {ref_date: "2026-03-31", point: mito, solar_mw: 20, known_at: "2026-08-20 15:00:00+00", known_until: null, basis: rule, first_seen: "2026-11-16 00:42:00+00", correction: false}

  - name: a_refetched_file_is_a_new_version_only_if_its_figures_changed
    description: >
      Table A of end of March 2026 is fetched again on 2026-12-02 JST with Ibaraki changed and
      Kanagawa not, then again a day later unchanged. Ibaraki gets a second version known at the
      first re-fetch; Kanagawa keeps one.
    model: dwd_capacity_area
    given:
      - input: ref('dwd_capacity_area_files')
        rows:
          - {source_file: fA, point: mito, ref_date: "2026-03-31", fetched_at: "2026-11-16 00:42:00+00", solar_mw: 20}
          - {source_file: fA, point: yokohama, ref_date: "2026-03-31", fetched_at: "2026-11-16 00:42:00+00", solar_mw: 30}
          - {source_file: fA2, point: mito, ref_date: "2026-03-31", fetched_at: "2026-12-01 23:45:00+00", solar_mw: 20.1}
          - {source_file: fA2, point: yokohama, ref_date: "2026-03-31", fetched_at: "2026-12-01 23:45:00+00", solar_mw: 30}
          - {source_file: fA3, point: mito, ref_date: "2026-03-31", fetched_at: "2026-12-02 23:45:00+00", solar_mw: 20.1}
          - {source_file: fA3, point: yokohama, ref_date: "2026-03-31", fetched_at: "2026-12-02 23:45:00+00", solar_mw: 30}
      - input: ref('dwd_capacity_releases')
        rows:
          - {ref_date: "2026-03-31", known_at: "2026-08-20 15:00:00+00", basis: rule}
    expect:
      rows:
        - {point: mito, solar_mw: 20, known_at: "2026-08-20 15:00:00+00", known_until: "2026-12-01 23:45:00+00", basis: rule, correction: false}
        - {point: mito, solar_mw: 20.1, known_at: "2026-12-01 23:45:00+00", known_until: null, basis: captured, correction: true}
        - {point: yokohama, solar_mw: 30, known_at: "2026-08-20 15:00:00+00", known_until: null, basis: rule, correction: false}

  - name: a_file_fetched_again_before_its_release_was_known_counts_once
    description: >
      End of June 2026: table A is fetched on 2026-12-11 JST, again later that day with Ibaraki
      changed, and the release is known only at the next morning's fetch of table B. Its one
      version is the later copy, known with the release. End of September 2026 has no date in
      dwd_capacity_releases yet (one table held), so it has no figures.
    model: dwd_capacity_area
    given:
      - input: ref('dwd_capacity_area_files')
        rows:
          - {source_file: fA6, point: mito, ref_date: "2026-06-30", fetched_at: "2026-12-10 23:45:30+00", solar_mw: 21}
          - {source_file: fA6b, point: mito, ref_date: "2026-06-30", fetched_at: "2026-12-11 10:00:00+00", solar_mw: 21.05}
          - {source_file: fA9, point: mito, ref_date: "2026-09-30", fetched_at: "2027-02-10 23:45:30+00", solar_mw: 22}
      - input: ref('dwd_capacity_releases')
        rows:
          - {ref_date: "2026-06-30", known_at: "2026-12-11 23:45:30+00", basis: captured}
    expect:
      rows:
        - {ref_date: "2026-06-30", point: mito, solar_mw: 21.05, known_at: "2026-12-11 23:45:30+00", known_until: null, basis: captured, first_seen: "2026-12-11 10:00:00+00", correction: false}

  # Weather. Times are UTC. MSM's delay is 3 hours and GSM's 6 (dim_weather_models).

  - name: weather_versions_take_the_rule_then_each_changed_fetch_never_earlier
    description: >
      MSM lead 2, hour 2026-11-10 03:00: known by the rule at 2026-11-08 06:00 (− 48 h + 3 h); its
      file was parsed twice and only the newer parse counts; a later copy with the same value adds
      nothing. GSM lead 0, hour 2026-11-14 23:00, rule time 2026-11-15 05:00: a copy fetched at
      02:00 changed it, but a change is never known before the version it replaces, so both share
      05:00 and the newer copy is kept; a copy on 16 November changed it again, known at that fetch.
    model: dwd_weather_previous_runs
    given:
      - input: ref('dim_weather_models')
        rows:
          - {model: jma_msm, delay_hours: 3}
          - {model: jma_gsm, delay_hours: 6}
      - input: source('ods', 'openmeteo_previous_runs')
        rows:
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-10 03:00:00+00", shortwave_radiation: 999, source_file: f1, fetched_at: "2026-11-15 00:00:00+00", ingested_at: "2026-11-15 01:00:00+00"}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-10 03:00:00+00", shortwave_radiation: 300, source_file: f1, fetched_at: "2026-11-15 00:00:00+00", ingested_at: "2026-11-16 01:00:00+00"}
          - {point: tokyo, model: jma_gsm, lead_days: 0, valid_time: "2026-11-14 23:00:00+00", temperature_2m: 10, source_file: f1, fetched_at: "2026-11-15 00:00:00+00", ingested_at: "2026-11-16 01:00:00+00"}
          - {point: tokyo, model: jma_gsm, lead_days: 0, valid_time: "2026-11-14 23:00:00+00", temperature_2m: 11, source_file: f2, fetched_at: "2026-11-15 02:00:00+00", ingested_at: "2026-11-15 03:00:00+00"}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-10 03:00:00+00", shortwave_radiation: 300, source_file: f3, fetched_at: "2026-11-16 03:00:00+00", ingested_at: "2026-11-16 04:00:00+00"}
          - {point: tokyo, model: jma_gsm, lead_days: 0, valid_time: "2026-11-14 23:00:00+00", temperature_2m: 12, source_file: f3, fetched_at: "2026-11-16 03:00:00+00", ingested_at: "2026-11-16 04:00:00+00"}
    expect:
      rows:
        - {model: jma_msm, lead_days: 2, ghi_w_m2: 300, temperature_c: null, known_at: "2026-11-08 06:00:00+00", known_until: null, basis: rule}
        - {model: jma_gsm, lead_days: 0, ghi_w_m2: null, temperature_c: 11, known_at: "2026-11-15 05:00:00+00", known_until: "2026-11-16 03:00:00+00", basis: captured}
        - {model: jma_gsm, lead_days: 0, ghi_w_m2: null, temperature_c: 12, known_at: "2026-11-16 03:00:00+00", known_until: null, basis: captured}

  - name: a_single_run_is_known_its_models_delay_after_it_starts
    description: >
      MSM's run of 18:00 is known at 21:00, GSM's at 00:00 the next day; two runs of the same hour
      stay two forecasts, never versions of each other.
    model: dwd_weather_single_runs
    given:
      - input: ref('dim_weather_models')
        rows:
          - {model: jma_msm, delay_hours: 3}
          - {model: jma_gsm, delay_hours: 6}
      - input: source('ods', 'openmeteo_single_runs')
        rows:
          - {point: tokyo, model: jma_msm, run_time: "2026-11-14 18:00:00+00", valid_time: "2026-11-16 03:00:00+00", shortwave_radiation: 400, source_file: s1, fetched_at: "2026-11-16 05:00:00+00", ingested_at: "2026-11-16 06:00:00+00"}
          - {point: tokyo, model: jma_msm, run_time: "2026-11-14 21:00:00+00", valid_time: "2026-11-16 03:00:00+00", shortwave_radiation: 420, source_file: s2, fetched_at: "2026-11-16 05:00:00+00", ingested_at: "2026-11-16 06:00:00+00"}
          - {point: tokyo, model: jma_gsm, run_time: "2026-11-14 18:00:00+00", valid_time: "2026-11-16 03:00:00+00", temperature_2m: 15, source_file: s3, fetched_at: "2026-11-16 05:00:00+00", ingested_at: "2026-11-16 06:00:00+00"}
    expect:
      rows:
        - {model: jma_msm, run_time: "2026-11-14 18:00:00+00", ghi_w_m2: 400, known_at: "2026-11-14 21:00:00+00", known_until: null, basis: rule}
        - {model: jma_msm, run_time: "2026-11-14 21:00:00+00", ghi_w_m2: 420, known_at: "2026-11-15 00:00:00+00", known_until: null, basis: rule}
        - {model: jma_gsm, run_time: "2026-11-14 18:00:00+00", ghi_w_m2: null, known_at: "2026-11-15 00:00:00+00", known_until: null, basis: rule}

  - name: slots_take_radiation_from_the_hour_after_and_interpolate_the_rest
    description: >
      Tokyo, MSM, lead 2, the morning of 10 November (06:00 JST is 21:00 UTC on the 9th), as in
      notebook 04, section 3.5, with values that interpolate exactly. Both slots of an hour take the
      radiation stamped at its end; temperature is interpolated to the slot's middle (a quarter or
      three quarters of the way to the next hour). A slot is known when the later of its hours is:
      hour 20:00 was first held late, at 05:00 on the 8th, after hour 21:00, so the slots between
      them wait for it rather than start without its temperature. The slots before 20:00 have no
      hour before them: radiation only. Hour 23:00 was corrected on 16 November, radiation only:
      the two slots taking their radiation from it get a second, captured version; the two
      interpolating its unchanged temperature get none.
    model: dwd_weather_slots
    given:
      - input: ref('dwd_weather_previous_runs')
        rows:
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-09 20:00:00+00", ghi_w_m2: 0, temperature_c: 9, known_at: "2026-11-08 05:00:00+00", known_until: null, basis: rule}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-09 21:00:00+00", ghi_w_m2: 0, temperature_c: 10, known_at: "2026-11-08 00:00:00+00", known_until: null, basis: rule}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-09 22:00:00+00", ghi_w_m2: 5, temperature_c: 12, known_at: "2026-11-08 01:00:00+00", known_until: null, basis: rule}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-09 23:00:00+00", ghi_w_m2: 59, temperature_c: 11, known_at: "2026-11-08 02:00:00+00", known_until: "2026-11-16 03:00:00+00", basis: rule}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-09 23:00:00+00", ghi_w_m2: 60, temperature_c: 11, known_at: "2026-11-16 03:00:00+00", known_until: null, basis: captured}
          - {point: tokyo, model: jma_msm, lead_days: 2, valid_time: "2026-11-10 00:00:00+00", ghi_w_m2: 185, temperature_c: 13, known_at: "2026-11-08 03:00:00+00", known_until: null, basis: rule}
      - input: ref('dwd_weather_single_runs')
        rows: []
      - input: ref('dwd_weather_live')
        rows: []
    expect:
      rows:
        - {slot_start: "2026-11-09 19:00:00+00", ghi_w_m2: 0, temperature_c: null, known_at: "2026-11-08 05:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 19:30:00+00", ghi_w_m2: 0, temperature_c: null, known_at: "2026-11-08 05:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 20:00:00+00", ghi_w_m2: 0, temperature_c: 9.25, known_at: "2026-11-08 05:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 20:30:00+00", ghi_w_m2: 0, temperature_c: 9.75, known_at: "2026-11-08 05:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 21:00:00+00", ghi_w_m2: 5, temperature_c: 10.5, known_at: "2026-11-08 01:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 21:30:00+00", ghi_w_m2: 5, temperature_c: 11.5, known_at: "2026-11-08 01:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 22:00:00+00", ghi_w_m2: 59, temperature_c: 11.75, known_at: "2026-11-08 02:00:00+00", known_until: "2026-11-16 03:00:00+00", basis: rule}
        - {slot_start: "2026-11-09 22:00:00+00", ghi_w_m2: 60, temperature_c: 11.75, known_at: "2026-11-16 03:00:00+00", known_until: null, basis: captured}
        - {slot_start: "2026-11-09 22:30:00+00", ghi_w_m2: 59, temperature_c: 11.25, known_at: "2026-11-08 02:00:00+00", known_until: "2026-11-16 03:00:00+00", basis: rule}
        - {slot_start: "2026-11-09 22:30:00+00", ghi_w_m2: 60, temperature_c: 11.25, known_at: "2026-11-16 03:00:00+00", known_until: null, basis: captured}
        - {slot_start: "2026-11-09 23:00:00+00", ghi_w_m2: 185, temperature_c: 11.5, known_at: "2026-11-08 03:00:00+00", known_until: null, basis: rule}
        - {slot_start: "2026-11-09 23:30:00+00", ghi_w_m2: 185, temperature_c: 12.5, known_at: "2026-11-08 03:00:00+00", known_until: null, basis: rule}

  - name: a_capture_is_a_daily_fetch_counted_once
    description: >
      A daily file fed two ODS tables and was parsed twice: one capture. An initial load and a
      monthly re-capture are not daily captures, so neither counts, however early they came.
    model: dwd_source_captures
    given:
      - input: source('ods', 'raw_files')
        rows:
          - {source: tepco_actuals, path: a/1.csv, load_type: daily, ods_table: t1, parser_version: "1", extraction_date: "2026-11-15", fetched_at: "2026-11-14 23:45:00+00"}
          - {source: tepco_actuals, path: a/1.csv, load_type: daily, ods_table: t2, parser_version: "1", extraction_date: "2026-11-15", fetched_at: "2026-11-14 23:45:00+00"}
          - {source: tepco_actuals, path: a/1.csv, load_type: daily, ods_table: t1, parser_version: "2", extraction_date: "2026-11-15", fetched_at: "2026-11-14 23:45:00+00"}
          - {source: tepco_actuals, path: a/0.csv, load_type: initial, ods_table: t1, parser_version: "1", extraction_date: "2026-11-13", fetched_at: "2026-11-13 01:00:00+00"}
          - {source: tepco_actuals, path: a/2.csv, load_type: recapture, ods_table: t1, parser_version: "1", extraction_date: "2026-12-01", fetched_at: "2026-12-01 00:30:00+00"}
    expect:
      rows:
        - {source: tepco_actuals, source_file: a/1.csv, known_at: "2026-11-14 23:45:00+00", known_until: null}

