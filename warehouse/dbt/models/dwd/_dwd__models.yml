version: 2

# A model private to a group can be read only by the models and tests of that group: dbt refuses
# any other ref when it parses the project.
groups:
  - name: capacity_figures
    owner:
      name: warehouse
    description: >
      The capacity figures per raw file, which have no known_at, and the versions made from them.
      Only the versions are read outside the group, through as_of.

models:
  - name: dwd_tepco_actuals
    description: >
      TEPCO's monthly area actuals as versions: one row per slot, measure and version, in MW
      averaged over the slot. Read for a decision time only through `as_of`. The yearly files are
      another model, off the training path (notebook 04, section 2.3).
    columns:
      - name: slot_start
        description: The slot's start, as a timestamp (TEPCO labels slots by their start, in JST).
        data_tests: [not_null]
      - name: measure
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [solar, solar_curtailed, wind]
      - name: value_mw
        description: MW averaged over the slot; null where the file had no value.
      - name: known_at
        description: When we could have had this version. Never the parse time.
        data_tests: [not_null]
      - name: known_until
        description: When the next version became known; null for the current one.
      - name: basis
        description: >
          `rule` (slot end + 1 hour, before capture start) or `captured` (the fetch time of the
          first file holding this value).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, captured]
      - name: first_seen
        description: Fetch time of the first file holding this value.
        data_tests: [not_null]
      - name: source_file
        description: That file.
        data_tests: [not_null]
      - name: correction
        description: True when this version replaced an earlier value.
    data_tests:
      - unique_combination:
          arguments:
            columns: [slot_start, measure, known_at]
      - expression_is_true:
          arguments:
            expression: known_until is null or known_until > known_at
      - expression_is_true:
          arguments:
            expression: basis = 'rule' or known_at = first_seen
      - expression_is_true:
          arguments:
            expression: value_mw is null or value_mw >= 0

  - name: dwd_capacity_releases
    description: >
      METI's quarterly FIT/FIP capacity releases and when each became known: one row per release
      held in both its tables. Read for a decision time only through `as_of`. The figures
      themselves are another model; a file fetched again is a new version of those, never a new
      date here (notebook 04, section 6).
    columns:
      - name: ref_date
        description: The quarter's last day, the date the release's figures describe.
        data_tests: [unique, not_null]
      - name: known_at
        description: When we could have had both its files. Never the parse time.
        data_tests: [not_null]
      - name: known_until
        description: Always null; a release is one fact, so nothing ends it. Kept for `as_of`.
      - name: basis
        description: >
          `rule` (the history rule, for a date before capture start) or `captured` (the fetch of
          the capture that first held both files).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, captured]
      - name: rule
        description: >
          Which part of the rule set the date: `announced` (the end of the announcement date),
          `last_modified` (a file went up after it) or `margin` (never announced: the end of the
          files' day + 16 days). Null when captured.
        data_tests:
          - accepted_values:
              arguments:
                values: [announced, last_modified, margin]
      - name: announced
        description: >
          The latest announcement date any copy of the page taken before capture start showed;
          null if none did.
      - name: a_last_modified
        description: "`Last-Modified` of table A's first copy."
        data_tests: [not_null]
      - name: b_last_modified
        description: "`Last-Modified` of table B's first copy."
        data_tests: [not_null]
      - name: first_held
        description: The fetch time at which we first held both tables.
        data_tests: [not_null]
    data_tests:
      - expression_is_true:
          arguments:
            expression: (basis = 'rule') = (rule is not null)
      - expression_is_true:
          arguments:
            expression: basis = 'rule' or known_at = first_held
      # Never known before its files went up.
      - expression_is_true:
          arguments:
            expression: known_at >= greatest(a_last_modified, b_last_modified)
      - expression_is_true:
          arguments:
            expression: ref_date = last_day(ref_date) and extract(month from ref_date) in (3, 6, 9, 12)

  - name: dwd_capacity_area_files
    config: {group: capacity_figures, access: private}
    description: >
      Installed solar per raw capacity file and part of the TEPCO area, in MW: new and transferred
      installations, under and over 10 kW, each file as last parsed. Incremental: a run reads only
      the files whose newest parse it doesn't hold, and BigQuery reads only their partitions and
      blocks (macro only_files). No known_at: dwd_capacity_area versions these.
    columns:
      - name: source_file
        description: The raw file, as the manifest's `path`.
        data_tests: [not_null]
      - name: point
        description: The weather point of the part (seed dim_tepco_area_parts).
        data_tests: [not_null]
      - name: ref_date
        data_tests: [not_null]
      - name: meti_table
        data_tests:
          - accepted_values:
              arguments:
                values: [pref, city]
      - name: fetched_at
        description: When the file was fetched.
        data_tests: [not_null]
      - name: parsed_at
        description: "`ingested_at` of the file's newest parse in the manifest: what the model holds."
        data_tests: [not_null]
      - name: meti_areas
        description: How many of METI's areas were summed into the part (20 for numazu, else 1).
      - name: solar_mw
        description: MW, from METI's kW summed exactly (as NUMERIC).
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_file, point]
      - expression_is_true:
          arguments:
            expression: solar_mw > 0

  - name: dwd_capacity_area
    config: {group: capacity_figures}
    description: >
      Installed solar per capacity release and part of the TEPCO area, in MW, as versions. Read for
      a decision time only through `as_of`. A release's first version is known when the release is;
      a re-fetched file with changed figures is a later version (notebook 04, sections 6.6 to 6.8).
    columns:
      - name: ref_date
        description: The quarter's last day, the date the figures describe.
        data_tests: [not_null]
      - name: point
        description: The weather point of the part (seed dim_tepco_area_parts).
        data_tests: [not_null]
      - name: solar_mw
        data_tests: [not_null]
      - name: known_at
        description: When we could have had this version. Never the parse time.
        data_tests: [not_null]
      - name: known_until
        description: When the next version became known; null for the current one.
      - name: basis
        description: >
          The release's basis for a first version (`rule` or `captured`); `captured` for a later
          one, known at the fetch of the file holding it.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, captured]
      - name: first_seen
        description: Fetch time of the first file holding this value.
        data_tests: [not_null]
      - name: source_file
        description: That file.
        data_tests: [not_null]
      - name: correction
        description: True when this version replaced earlier figures.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ref_date, point, known_at]
      - expression_is_true:
          arguments:
            expression: known_until is null or known_until > known_at
      - expression_is_true:
          arguments:
            expression: not correction or (basis = 'captured' and known_at >= first_seen)

  - name: dwd_weather_previous_runs
    description: >
      Open-Meteo Previous Runs as versions, per point, model, lead and hour (UTC), each model as the
      source gave it: a hole stays a missing hour. The six variables are named with their units.
    columns:
      - name: point
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_points')
                field: point
      - name: model
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_models')
                field: model
      - name: lead_days
        description: Days between the run and the hour (0 to 2). Features use 2; 0 and 1 serve the leak scenario F2.
        data_tests: [not_null]
      - name: valid_time
        description: The hour, UTC, as Open-Meteo stamps it; radiation is the mean of the hour before.
        data_tests: [not_null]
      - name: known_at
        description: The hour − 24 h × lead + the model's delay for a first version (basis rule); the fetch that first held a changed value for a later one (basis captured), never before the version it replaces.
        data_tests: [not_null]
      - name: known_until
        description: When the next version became known; null for the current one.
      - name: basis
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, captured]
    data_tests:
      - unique_combination:
          arguments:
            columns: [point, model, lead_days, valid_time, known_at]
      - expression_is_true:
          arguments:
            expression: known_until is null or known_until > known_at
      - expression_is_true:
          arguments:
            expression: ghi_w_m2 >= 0 and direct_w_m2 >= 0 and diffuse_w_m2 >= 0
      - expression_is_true:
          arguments:
            expression: cloud_cover_pct between 0 and 100
      - expression_is_true:
          arguments:
            expression: not correction or (basis = 'captured' and known_at >= first_seen)

  - name: dwd_weather_single_runs
    description: >
      Open-Meteo Single Runs as versions, per point, model, run and hour, runs never collapsed.
    columns:
      - name: point
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_points')
                field: point
      - name: model
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_models')
                field: model
      - name: run_time
        description: The run's start, UTC.
        data_tests: [not_null]
      - name: valid_time
        description: The hour, UTC, as Open-Meteo stamps it; radiation is the mean of the hour before.
        data_tests: [not_null]
      - name: known_at
        description: The run's start + the model's delay (dim_weather_models), basis rule; a later changed copy, at its fetch.
        data_tests: [not_null]
      - name: known_until
        description: When the next version became known; null for the current one.
      - name: basis
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, captured]
    data_tests:
      - unique_combination:
          arguments:
            columns: [point, model, run_time, valid_time, known_at]
      - expression_is_true:
          arguments:
            expression: known_until is null or known_until > known_at
      - expression_is_true:
          arguments:
            expression: ghi_w_m2 >= 0 and direct_w_m2 >= 0 and diffuse_w_m2 >= 0
      - expression_is_true:
          arguments:
            expression: cloud_cover_pct between 0 and 100

  - name: dwd_weather_live
    description: >
      The live forecast captured daily, per point, model, capture and hour, known at the fetch.
    columns:
      - name: point
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_points')
                field: point
      - name: model
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_models')
                field: model
      - name: captured_at
        description: "The fetch, each daily capture its own forecast."
        data_tests: [not_null]
      - name: valid_time
        description: The hour, UTC, as Open-Meteo stamps it; radiation is the mean of the hour before.
        data_tests: [not_null]
      - name: known_at
        description: The fetch.
        data_tests: [not_null]
      - name: known_until
        description: When the next version became known; null for the current one.
      - name: basis
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [captured]
    data_tests:
      - unique_combination:
          arguments:
            columns: [point, model, captured_at, valid_time, known_at]
      - expression_is_true:
          arguments:
            expression: known_until is null or known_until > known_at
      - expression_is_true:
          arguments:
            expression: ghi_w_m2 >= 0 and direct_w_m2 >= 0 and diffuse_w_m2 >= 0
      - expression_is_true:
          arguments:
            expression: cloud_cover_pct between 0 and 100
      - expression_is_true:
          arguments:
            expression: known_at = captured_at and known_until is null

  - name: dwd_weather_slots
    description: >
      The three weather sources on 30-minute slots in JST, per source, point, model, lead or run or
      capture, and slot, as versions: radiation from the hour ending after the slot, the rest
      interpolated to the slot's middle; known once both hours are. No hole is filled here.
    columns:
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [previous_runs, single_runs, live]
      - name: lead_days
        description: Previous Runs only.
      - name: run_time
        description: Single Runs only.
      - name: captured_at
        description: The live capture only.
      - name: slot_start
        description: The slot's start (JST slots, stored as a timestamp).
        data_tests: [not_null]
      - name: known_at
        description: When the later of the slot's two hours became known, or a later version of either.
        data_tests: [not_null]
      - name: known_until
        description: When the slot's next version became known; null for the current one.
      - name: basis
        description: "`captured` when either hour's version is, else `rule`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, captured]
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, point, model, lead_days, run_time, captured_at, slot_start, known_at]
      - expression_is_true:
          arguments:
            expression: known_until is null or known_until > known_at
      - expression_is_true:
          arguments:
            expression: extract(minute from slot_start) in (0, 30) and extract(second from slot_start) = 0
      - expression_is_true:
          arguments:
            expression: ghi_w_m2 >= 0 and cloud_cover_pct between 0 and 100

  - name: dwd_source_captures
    description: >
      Every daily capture, one row per source and raw file fetched, known when it was fetched:
      where each versioned model takes its capture start from, and the spine its newest capture.
    columns:
      - name: source
        data_tests: [not_null]
      - name: source_file
        description: The raw file's path.
        data_tests: [not_null]
      - name: known_at
        description: The fetch.
        data_tests: [not_null]
      - name: known_until
        description: Always null; a capture is a fact of its own, never a version of another.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, source_file, fetched_at]
      - expression_is_true:
          arguments:
            expression: known_at = fetched_at and known_until is null

unit_tests:
  # Times are UTC; JST is UTC+9. Capture start is the 08:45 JST daily capture of 2026-11-15
  # (2026-11-14 23:45 UTC). Slot A, 12:00 JST on 2026-11-14, has rule time 13:30 JST (04:30 UTC).

  - name: the_same_value_seen_again_or_reparsed_is_not_a_new_version
    description: >
      Two daily captures hold the same values, and both files were parsed again under a new
      parser version. The first parse of the first file was wrong (500): DWD reads each file as
      last parsed, so the wrong value never becomes a version, and every known_at stays the rule's.
    model: dwd_tepco_actuals
    given:
      - input: ref('dwd_source_captures')
        rows:
          - {source: tepco_actuals, known_at: "2026-11-14 23:45:00+00"}
          - {source: tepco_actuals, known_at: "2026-11-15 23:45:00+00"}
      - input: source('ods', 'tepco_actuals')
        rows:
          - {source_file: f1, date: "2026/11/14", time: "12:00", solar: 500, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-14 23:45:00+00", ingested_at: "2026-11-15 00:00:00+00", parser_version: "1"}
          - {source_file: f1, date: "2026/11/14", time: "12:00", solar: 5000, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-14 23:45:00+00", ingested_at: "2026-11-17 00:00:00+00", parser_version: "2"}
          - {source_file: f2, date: "2026/11/14", time: "12:00", solar: 5000, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-15 23:45:00+00", ingested_at: "2026-11-16 00:00:00+00", parser_version: "1"}
          - {source_file: f2, date: "2026/11/14", time: "12:00", solar: 5000, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-15 23:45:00+00", ingested_at: "2026-11-17 00:00:00+00", parser_version: "2"}
    expect:
      rows:
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar, value_mw: 5000, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar_curtailed, value_mw: 0, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2026-11-14 03:00:00+00", measure: wind, value_mw: 100, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}

  - name: a_correction_is_a_new_version_known_when_fetched
    description: >
      The second daily capture changes slot A's solar value. The correction is known when that file
      was fetched, and it ends the first version there.
    model: dwd_tepco_actuals
    given:
      - input: ref('dwd_source_captures')
        rows:
          - {source: tepco_actuals, known_at: "2026-11-14 23:45:00+00"}
          - {source: tepco_actuals, known_at: "2026-11-15 23:45:00+00"}
      - input: source('ods', 'tepco_actuals')
        rows:
          - {source_file: f1, date: "2026/11/14", time: "12:00", solar: 5000, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-14 23:45:00+00", ingested_at: "2026-11-15 00:00:00+00", parser_version: "1"}
          - {source_file: f2, date: "2026/11/14", time: "12:00", solar: 5100, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-15 23:45:00+00", ingested_at: "2026-11-16 00:00:00+00", parser_version: "1"}
    expect:
      rows:
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar, value_mw: 5000, known_at: "2026-11-14 04:30:00+00", known_until: "2026-11-15 23:45:00+00", basis: rule, correction: false}
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar, value_mw: 5100, known_at: "2026-11-15 23:45:00+00", known_until: null, basis: captured, correction: true}
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar_curtailed, value_mw: 0, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2026-11-14 03:00:00+00", measure: wind, value_mw: 100, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}

  - name: a_late_backfill_gets_its_fetch_time_after_capture_start
    description: >
      Notebook 04, section 2.2: slot B (12:30 JST on 2026-11-15) was first seen by the 14:02 JST
      re-capture. Its rule time, 14:00 JST, falls after capture start, so it takes the fetch time,
      never the earlier rule time. Slot C (2024-03-01) came in an initial load fetched after
      capture start; its rule time falls before capture start, so it keeps the rule.
    model: dwd_tepco_actuals
    given:
      - input: ref('dwd_source_captures')
        rows:
          - {source: tepco_actuals, known_at: "2026-11-14 23:45:00+00"}
      - input: source('ods', 'tepco_actuals')
        rows:
          - {source_file: f2, date: "2026/11/15", time: "12:30", solar: 6000, solar_curtailed: 0, wind: 200, fetched_at: "2026-11-15 05:02:00+00", ingested_at: "2026-11-15 06:00:00+00", parser_version: "1"}
          - {source_file: f3, date: "2024/03/01", time: "12:00", solar: 3000, solar_curtailed: 0, wind: 50, fetched_at: "2026-11-15 01:00:00+00", ingested_at: "2026-11-15 02:00:00+00", parser_version: "1"}
    expect:
      rows:
        - {slot_start: "2026-11-15 03:30:00+00", measure: solar, value_mw: 6000, known_at: "2026-11-15 05:02:00+00", known_until: null, basis: captured, correction: false}
        - {slot_start: "2026-11-15 03:30:00+00", measure: solar_curtailed, value_mw: 0, known_at: "2026-11-15 05:02:00+00", known_until: null, basis: captured, correction: false}
        - {slot_start: "2026-11-15 03:30:00+00", measure: wind, value_mw: 200, known_at: "2026-11-15 05:02:00+00", known_until: null, basis: captured, correction: false}
        - {slot_start: "2024-03-01 03:00:00+00", measure: solar, value_mw: 3000, known_at: "2024-03-01 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2024-03-01 03:00:00+00", measure: solar_curtailed, value_mw: 0, known_at: "2024-03-01 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2024-03-01 03:00:00+00", measure: wind, value_mw: 50, known_at: "2024-03-01 04:30:00+00", known_until: null, basis: rule, correction: false}

  - name: capture_start_is_the_sources_own_first_capture
    description: >
      JEPX's daily capture started earlier (2026-11-10). It doesn't move TEPCO's capture start: if
      it did, slot A (rule time 13:30 JST on 2026-11-14) would fall after it and take its fetch time
      instead of the rule. (That an initial load is no capture is dwd_source_captures' own test.)
    model: dwd_tepco_actuals
    given:
      - input: ref('dwd_source_captures')
        rows:
          - {source: jepx_spot, known_at: "2026-11-10 02:00:00+00"}
          - {source: tepco_actuals, known_at: "2026-11-14 23:45:00+00"}
      - input: source('ods', 'tepco_actuals')
        rows:
          - {source_file: f1, date: "2026/11/14", time: "12:00", solar: 5000, solar_curtailed: 0, wind: 100, fetched_at: "2026-11-14 23:45:00+00", ingested_at: "2026-11-15 00:00:00+00", parser_version: "1"}
    expect:
      rows:
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar, value_mw: 5000, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2026-11-14 03:00:00+00", measure: solar_curtailed, value_mw: 0, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}
        - {slot_start: "2026-11-14 03:00:00+00", measure: wind, value_mw: 100, known_at: "2026-11-14 04:30:00+00", known_until: null, basis: rule, correction: false}

  # dwd_capacity_releases. Times are UTC; JST is UTC+9. Capture start is the 08:45 JST daily
  # capture of 2026-11-17 (2026-11-16 23:45 UTC), as in the data. The end of an announcement date
  # in JST is 15:00 UTC on that date.

  - name: the_rule_takes_the_announcement_never_before_the_files
    description: >
      End of March 2026 was announced on 2026-08-20, after its files went up on 2026-08-18: known
      at the end of the 20th. End of June 2020 was announced on 2020-11-10, but its table B was
      re-uploaded on 2021-10-05 and only that copy is held: known then (notebook 04, section 6.2).
    model: dwd_capacity_releases
    given:
