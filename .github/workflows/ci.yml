name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jtf: ${{ steps.filter.outputs.jtf }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The jtf job lints every notebook, and its tests load the dbt project into Dagster,
          # so a change to either runs it too.
          filters: |
            jtf:
              - 'jtf/**'
              - 'notebooks/**'
              - 'warehouse/dbt/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

  jtf:
    needs: changes
    if: needs.changes.outputs.jtf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: docker build -t jtf:ci .
      - run: docker run --rm jtf:ci version
