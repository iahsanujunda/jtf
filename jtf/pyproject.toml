[project]
name = "jtf"
version = "0.1.0"
description = "Day-ahead forecasting pipeline for Tokyo-area solar output and JEPX prices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
jtf = "jtf.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jtf"]
