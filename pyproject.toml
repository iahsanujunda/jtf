# uv workspace root. It is not a package itself; the code lives in the members.
[tool.uv.workspace]
members = ["jtf"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["jtf/src", "jtf/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["jtf/tests"]
