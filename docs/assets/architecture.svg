<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" font-family="Helvetica, Arial, sans-serif" fill="#1F2937">
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#374151"/>
    </marker>
    <marker id="end-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C6BA8"/>
    </marker>
  </defs>

  <rect width="1280" height="790" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="42" font-size="20" font-weight="700">JEPX Tokyo forecast · production architecture</text>
  <text x="30" y="64" font-size="12.5" fill="#6B7280">Capture runs as a plain scheduled job because missed data cannot be recovered; Dagster runs everything that can be rebuilt from raw files.</text>

  <!-- Public sources -->
  <text x="30" y="122" font-size="14" font-weight="700">Public sources</text>
  <text x="30" y="140" font-size="12" fill="#6B7280">contacted by the capture job only</text>
  <g stroke="#9CA3AF" stroke-width="1.5" fill="#FFFFFF">
    <rect x="30" y="160" width="190" height="60" rx="8"/>
    <rect x="30" y="250" width="190" height="60" rx="8"/>
    <rect x="30" y="340" width="190" height="60" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="125" y="186" font-size="14" font-weight="700">JEPX</text>
    <text x="125" y="205" font-size="12" fill="#6B7280">day-ahead prices</text>
    <text x="125" y="276" font-size="14" font-weight="700">TEPCO Power Grid</text>
    <text x="125" y="295" font-size="12" fill="#6B7280">actuals · forecasts</text>
    <text x="125" y="366" font-size="14" font-weight="700">Open-Meteo</text>
    <text x="125" y="385" font-size="12" fill="#6B7280">weather runs</text>
  </g>
  <path d="M220,190 H245 M220,280 H245 M220,370 H245 M245,190 V370" stroke="#374151" stroke-width="1.5" fill="none"/>
  <line x1="245" y1="280" x2="298" y2="280" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>

  <!-- Outside watchdog -->
  <text x="30" y="462" font-size="11" fill="#6B7280">capture and publish ping on success</text>
  <rect x="30" y="470" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="125" y="494" font-size="13" font-weight="700" text-anchor="middle">healthchecks.io</text>
  <text x="125" y="512" font-size="11.5" fill="#6B7280" text-anchor="middle">alerts on a missed ping</text>

  <!-- Legend -->
  <line x1="30" y1="600" x2="70" y2="600" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>
  <text x="80" y="604" font-size="12">data and control flow</text>
  <line x1="30" y1="628" x2="70" y2="628" stroke="#7C6BA8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#end-muted)"/>
  <text x="80" y="632" font-size="12">off the deadline path</text>
  <rect x="30" y="646" width="40" height="18" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="660" font-size="12">run by hand</text>

  <!-- CI, outside GCP -->
  <rect x="1035" y="16" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1120" y="36" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text x="1120" y="54" font-size="11.5" fill="#6B7280" text-anchor="middle">test, build, push</text>

  <!-- Tokyo region -->
  <rect x="270" y="90" width="990" height="610" rx="14" fill="#F3F7FC" stroke="#9DB4D3" stroke-width="1.5"/>
  <text x="288" y="116" font-size="14" font-weight="700">GCP prod · Tokyo (asia-northeast1)</text>
  <text x="288" y="134" font-size="12" fill="#6B7280">no public IPs; the Dagster UI is reached through an IAP tunnel</text>

  <line x1="1120" y1="64" x2="1120" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>

  <!-- Capture lane -->
  <g stroke="#4B6A91" stroke-width="1.5" fill="#FFFFFF">
    <rect x="300" y="150" width="180" height="56" rx="8"/>
    <rect x="300" y="250" width="180" height="60" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="390" y="174" font-size="14" font-weight="700">Cloud Scheduler</text>
    <text x="390" y="193" font-size="11.5" fill="#6B7280">08:45 · 11:00 · 19:00 · 22:00</text>
    <text x="390" y="276" font-size="14" font-weight="700">Capture jobs</text>
    <text x="390" y="295" font-size="12" fill="#6B7280">one per source · jtf fetch</text>
  </g>
  <line x1="390" y1="206" x2="390" y2="248" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>

  <rect x="320" y="360" width="160" height="80" rx="8" fill="#EEF6EE" stroke="#5E8C61" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="400" y="386" font-size="14" font-weight="700">Raw files</text>
    <text x="400" y="406" font-size="12">Cloud Storage</text>
    <text x="400" y="424" font-size="12" fill="#6B7280">create-only</text>
  </g>
  <line x1="400" y1="312" x2="400" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>

  <rect x="320" y="480" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="400" y="504" font-size="14" font-weight="700">Fallback job</text>
    <text x="400" y="522" font-size="12">jtf daily, run by hand</text>
    <text x="400" y="539" font-size="12" fill="#6B7280">no Dagster or Cloud SQL</text>
  </g>

  <!-- Watchdog pings -->
  <path d="M305,312 V498 H222" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#end)"/>
  <path d="M560,442 V460 H305" stroke="#374151" stroke-width="1.5" fill="none"/>

  <!-- Dagster VM -->
  <rect x="540" y="150" width="420" height="290" rx="12" fill="#E6EFFA" stroke="#3B5B85" stroke-width="1.8"/>
  <text x="750" y="176" font-size="15" font-weight="700" text-anchor="middle">Dagster · Compute Engine VM</text>
  <text x="750" y="196" font-size="12" fill="#6B7280" text-anchor="middle">webserver · daemon · code location, all from the same image</text>
  <g stroke="#4B6A91" stroke-width="1.5" fill="#FFFFFF">
    <rect x="560" y="212" width="380" height="62" rx="8"/>
    <rect x="560" y="288" width="380" height="62" rx="8"/>
    <rect x="560" y="364" width="380" height="62" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="750" y="236" font-size="13.5" font-weight="700">Sensors and schedules</text>
    <text x="750" y="256" font-size="12" fill="#6B7280">new raw files → parse · 09:05 → predict · actuals → evaluate</text>
    <text x="750" y="312" font-size="13.5" font-weight="700">Asset graph, partitioned by day</text>
    <text x="750" y="332" font-size="12" fill="#6B7280">raw → ODS → DWD → DWS → predictions → evaluation</text>
    <text x="750" y="388" font-size="13.5" font-weight="700">Runs: one container each</text>
    <text x="750" y="408" font-size="12" fill="#6B7280">jtf functions · dbt · LightGBM · asset checks</text>
  </g>

  <line x1="482" y1="400" x2="538" y2="400" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>
  <text x="510" y="392" font-size="11" fill="#6B7280" text-anchor="middle">sensor</text>

  <!-- Right column -->
  <rect x="1000" y="150" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#4B6A91" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="1120" y="174" font-size="14" font-weight="700">Artifact Registry</text>
    <text x="1120" y="193" font-size="12">one image, by digest</text>
    <text x="1120" y="210" font-size="12" fill="#6B7280">capture, fallback, Dagster</text>
  </g>
  <line x1="998" y1="185" x2="962" y2="185" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>

  <rect x="1000" y="250" width="240" height="70" rx="8" fill="#EEF6EE" stroke="#5E8C61" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="1120" y="274" font-size="14" font-weight="700">Cloud SQL Postgres</text>
    <text x="1120" y="293" font-size="12">db-f1-micro, no HA</text>
    <text x="1120" y="310" font-size="12" fill="#6B7280">Dagster storage + MLflow</text>
  </g>
  <line x1="962" y1="285" x2="998" y2="285" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>

  <rect x="1000" y="360" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#7C6BA8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="1120" y="384" font-size="14" font-weight="700">MLflow</text>
    <text x="1120" y="403" font-size="12" fill="#6B7280">Cloud Run, scales to zero</text>
  </g>
  <line x1="1120" y1="360" x2="1120" y2="322" stroke="#374151" stroke-width="1.5" marker-end="url(#end)"/>
  <line x1="962" y1="392" x2="998" y2="392" stroke="#7C6BA8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#end-muted)"/>

  <!-- Storage row -->
  <g stroke="#5E8C61" stroke-width="1.5" fill="#EEF6EE">
    <rect x="540" y="480" width="200" height="80" rx="8"/>
    <rect x="770" y="480" width="190" height="80" rx="8"/>
    <rect x="540" y="610" width="200" height="70" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="640" y="506" font-size="14" font-weight="700">BigQuery</text>
    <text x="640" y="526" font-size="12">ODS → DWD → DWS → ADS</text>
    <text x="640" y="544" font-size="12" fill="#6B7280">+ monitoring tables</text>
    <text x="865" y="506" font-size="14" font-weight="700">Model files</text>
    <text x="865" y="526" font-size="12">Cloud Storage</text>
    <text x="865" y="544" font-size="12" fill="#6B7280">+ production pointer</text>
    <text x="640" y="634" font-size="14" font-weight="700">Dashboard data</text>
    <text x="640" y="653" font-size="12">Cloud Storage</text>
    <text x="640" y="670" font-size="12" fill="#6B7280">daily JSON snapshots</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="640" y1="442" x2="640" y2="478" marker-start="url(#start)" marker-end="url(#end)"/>
    <line x1="865" y1="442" x2="865" y2="478" marker-start="url(#start)" marker-end="url(#end)"/>
    <line x1="640" y1="562" x2="640" y2="608" marker-end="url(#end)"/>
  </g>
  <text x="648" y="590" font-size="11" fill="#6B7280">evaluate exports</text>

  <!-- Dashboard -->
  <rect x="770" y="610" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#7C6BA8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="865" y="634" font-size="14" font-weight="700">Dashboard</text>
    <text x="865" y="653" font-size="12">React on Cloud Run</text>
    <text x="865" y="670" font-size="12" fill="#6B7280">scales to zero</text>
  </g>
  <line x1="742" y1="645" x2="768" y2="645" stroke="#7C6BA8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#end-muted)"/>

  <!-- Browser, outside GCP -->
  <rect x="770" y="722" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="865" y="745" font-size="13.5" font-weight="700" text-anchor="middle">Browser</text>
  <text x="865" y="764" font-size="12" fill="#6B7280" text-anchor="middle">you, or the public link</text>
  <line x1="865" y1="682" x2="865" y2="720" stroke="#7C6BA8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#end-muted)"/>
</svg>
