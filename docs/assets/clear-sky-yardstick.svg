<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" fill="#1F2937">
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="42" font-size="20" font-weight="700">Clear-sky output is a rough yardstick</text>
  <text x="30" y="66" font-size="13" fill="#6B7280">Real output on clear days, divided by what a cloudless sky over flat panels would give. If the yardstick were exact,</text>
  <text x="30" y="84" font-size="13" fill="#6B7280">both lines would lie on 1.0 all day. They don't: the answer depends on the hour and on the time of year.</text>

  <!-- Legend -->
  <line x1="30" y1="112" x2="54" y2="112" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="116" font-size="13">January, clear days</text>
  <line x1="210" y1="112" x2="234" y2="112" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
  <text x="242" y="116" font-size="13">July, clear days</text>

  <!-- Grid and axes -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="80" y1="450.0" x2="900" y2="450.0"/>
    <line x1="80" y1="396.4" x2="900" y2="396.4"/>
    <line x1="80" y1="342.9" x2="900" y2="342.9"/>
    <line x1="80" y1="289.3" x2="900" y2="289.3"/>
    <line x1="80" y1="182.1" x2="900" y2="182.1"/>
  </g>
  <g font-size="12" fill="#6B7280" text-anchor="end">
    <text x="70" y="454.0">0.00</text>
    <text x="70" y="400.4">0.25</text>
    <text x="70" y="346.9">0.50</text>
    <text x="70" y="293.3">0.75</text>
    <text x="70" y="239.7">1.00</text>
    <text x="70" y="186.1">1.25</text>
  </g>
  <g font-size="12" fill="#6B7280" text-anchor="middle">
    <text x="140.7" y="472">06:00</text>
    <text x="323.0" y="472">09:00</text>
    <text x="505.2" y="472">12:00</text>
    <text x="687.4" y="472">15:00</text>
    <text x="869.6" y="472">18:00</text>
  </g>
  <text x="490" y="496" font-size="12" fill="#6B7280" text-anchor="middle">hour of day, JST</text>
  <text x="40" y="136" font-size="12" fill="#6B7280" text-anchor="start">output ÷ clear-sky output</text>

  <!-- The yardstick: clear-sky output exactly right -->
  <line x1="80" y1="235.7" x2="900" y2="235.7" stroke="#6B7280" stroke-width="1.5"/>
  <text x="900" y="252.7" font-size="12" fill="#6B7280" text-anchor="end">1.0: output equals clear-sky output</text>

  <!-- The two months -->
  <path d="M247.0,289.1 L277.4,255.4 L307.8,233.4 L338.1,218.4 L368.5,208.7 L398.9,202.9 L429.3,199.5 L459.6,198.0 L490.0,196.7 L520.4,195.4 L550.7,195.0 L581.1,195.0 L611.5,195.9 L641.9,198.0 L672.2,203.6 L702.6,212.4 L733.0,222.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M125.6,390.9 L155.9,373.1 L186.3,353.8 L216.7,336.9 L247.0,323.6 L277.4,313.9 L307.8,307.3 L338.1,302.4 L368.5,299.4 L398.9,297.4 L429.3,295.9 L459.6,295.3 L490.0,295.5 L520.4,295.7 L550.7,296.6 L581.1,297.9 L611.5,300.0 L641.9,303.4 L672.2,307.1 L702.6,312.2 L733.0,319.3 L763.3,329.1 L793.7,342.4 L824.1,360.2 L854.4,375.4" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="520.4" cy="195.4" r="4.5" fill="#2a78d6" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="520.4" cy="295.7" r="4.5" fill="#eb6834" stroke="#FFFFFF" stroke-width="2"/>

  <!-- What the lines say at noon; a white edge keeps the words clear of the grid -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
  <text x="520.4" y="163.4" font-size="13" font-weight="700" text-anchor="middle">January noon: 1.19</text>
  <text x="520.4" y="181.4" font-size="12" fill="#6B7280" text-anchor="middle">a cloudless sky gives 19% more than the yardstick says</text>
  <text x="520.4" y="321.7" font-size="13" font-weight="700" text-anchor="middle">July noon: 0.72</text>
  <text x="520.4" y="339.7" font-size="12" fill="#6B7280" text-anchor="middle">a cloudless sky gives 28% less than the yardstick says</text>
  </g>

  <!-- Source -->
  <text x="30" y="526" font-size="11.5" fill="#6B7280">Each half hour: the 90th percentile of output ÷ clear-sky output over the 29 days around a day, averaged over the month, February 2024 to November 2026.</text>
  <text x="30" y="542" font-size="11.5" fill="#6B7280">Only half hours with enough sun to compare; the first and last of each month are left out. Tokyo area. Source: notebook 09, section 2.</text>
</svg>
